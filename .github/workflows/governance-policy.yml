name: Governance policy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  governance-policy:
    name: Governance bootstrap integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify locked AI governance
        run: node scripts/check-ai-governance.mjs
