name: Dependency range hardening helper

on:
  push:
    branches:
      - chore/harden-dependency-ranges

permissions:
  contents: write

jobs:
  sync-lock-root-specifiers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/harden-dependency-ranges
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync lock root specifiers only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.packages[''].dependencies = pkg.dependencies;
          lock.packages[''].devDependencies = pkg.devDependencies;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit synchronized lock metadata
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'LOCK_METADATA_ALREADY_SYNCED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync lock root dependency ranges'
          git push origin HEAD:chore/harden-dependency-ranges
