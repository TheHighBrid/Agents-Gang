name: Repair security lockfile

on:
  push:
    branches:
      - fix/security-audit-lockfile

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/security-audit-lockfile

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11 to avoid npm 10.9.8 Arborist crash
        run: |
          npm install --global npm@11.6.0 --no-audit --no-fund
          npm --version

      - name: Set patched dependency policy
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.devDependencies = { ...pkg.devDependencies, vitest: '^4.1.11' };
          pkg.overrides = { ...pkg.overrides, 'js-yaml': '4.3.2' };
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Regenerate lockfile from patched policy
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify no high or critical vulnerabilities remain
        run: npm audit --audit-level=high

      - name: Verify supply-chain policy
        run: node scripts/check-supply-chain.mjs

      - name: Commit repaired dependency policy
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: repair dependency audit lockfile"
          git push origin HEAD:fix/security-audit-lockfile
