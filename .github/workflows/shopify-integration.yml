name: Shopify integration tests

on:
  push:

permissions:
  contents: read

jobs:
  shopify-integration:
    name: Shopify integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Shopify end-to-end integration tests
        run: npm test -- tests/shopify-tools.e2e.test.ts
